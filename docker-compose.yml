services:
    api:
        build:
            context: .
            target: development
        container_name: my-fintracker-api
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        env_file:
            - path: .env
        volumes:
            - ./src:/app/src
            - ./libs:/app/libs
            - ./scripts:/app/scripts
            - ./package.json:/app/package.json
            - ./package-lock.json:/app/package-lock.json
        ports:
            - '${APP_PORT}:${APP_PORT}'
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://localhost:${APP_PORT}/docs-json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 20s

    postgres:
        image: postgres:17-alpine
        container_name: my-fintracker-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: myfintracker
        ports:
            - '${DB_PORT}:5432'
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U ${DB_USER} -d ${DB_NAME}
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - postgres_data:/var/lib/postgresql/data

    rabbitmq:
        image: rabbitmq:4-management-alpine
        container_name: my-fintracker-rabbitmq
        restart: unless-stopped
        ports:
            - '5672:5672'
            - '15672:15672'
        healthcheck:
            test:
                - CMD
                - rabbitmq-diagnostics
                - -q
                - ping
            interval: 15s
            timeout: 5s
            retries: 5
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq

volumes:
    postgres_data:
    rabbitmq_data: